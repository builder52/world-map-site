<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polymarket Geopolitics Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; }

    /* ✨ свечение иконок (без движения) */
    .glow-icon {
      transition: filter 0.25s ease;
      filter: drop-shadow(0 0 8px #2E5CFF);
      border-radius: 50%;        /* делаем иконки круглыми */
      overflow: hidden;          /* обрезаем углы */
    }

    .glow-icon:hover {
      filter: drop-shadow(0 0 8px #2E5CFF) drop-shadow(0 0 14px #2E5CFF);
    }

    /* 🎨 цвет окна popup */
    .leaflet-popup-content-wrapper {
      background: #2E5CFF;
      color: white;
      border-radius: 10px;
      padding: 8px;
    }

    /* 🎨 цвет «хвостика» окна */
    .leaflet-popup-tip {
      background: #2E5CFF;
    }

    /* 🎨 удаляем отступы по умолчанию */
    .leaflet-popup-content {
      margin: 6px 8px;
    }

    /* 🎨 делаем ссылку белой */
    .leaflet-popup-content a {
      color: white;
      font-weight: bold;
      text-decoration: underline; /* можешь убрать */
    }

    /* 🎨 делаем крестик (close button) белым */
    .leaflet-popup-close-button {
      color: white !important;
    }

    /* ✨ кастомные иконки */
    .custom-icon {
      width: 20px;
      height: 20px;
      background-size: cover;
      border-radius: 50%;
      transition: transform 0.25s ease;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    console.log('script start'); // проверка, что скрипт запустился

    // 1. создаём карту
    const map = L.map('map', {
      minZoom: 2,              // минимальный зум (самое дальнее отдаление)
      maxZoom: 19,             // как раньше
      maxBounds: [
        [-85, -180],           // юго-запад карты
        [85, 180]              // северо-восток карты
      ],
      maxBoundsViscosity: 1.0  // блокирует выход за край (важно!)
    }).setView([20, 0], 2);

    // 2. тёмный слой
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors, © CARTO'
    }).addTo(map);

    // 3. кастомные иконки
    const eunatocountryannouncespeacekeepingforceinukraine = {
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Feunato-country-announces-peacekeeping-force-in-ukraine-FGU2DfeSjhiB.jpg&w=96&q=100',
      className: 'custom-icon' // класс для CSS
    };
    const natoeutroopsfightinginukraineby = {
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Fnatoeu-troops-fighting-in-ukraine-in-2025-ed2fIguRcJLj.jpg&w=96&q=100',
      className: 'custom-icon'
    };
    const putinandzelenskyyshakehandsbyjune30 = {
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Fputin-and-zelenskyy-shake-hands-by-october-31-AXm08sevgnUp.jpg&w=96&q=100',
      className: 'custom-icon'
    };

    // 4. маркеры
    const markers = [
      {
        name: 'EU/NATO country announces peacekeeping force in Ukraine?',
        coords: [48.3794, 31.1656],
        link: 'https://polymarket.com/event/eunato-country-announces-peacekeeping-force-in-ukraine?via=polymap',
        icon: eunatocountryannouncespeacekeepingforceinukraine
      },
      {
        name: 'NATO/EU troops fighting in Ukraine by...?',
        coords: [48.3794, 31.1656],
        link: 'https://polymarket.com/event/natoeu-troops-fighting-in-ukraine-in-2025?via=polymap',
        icon: natoeutroopsfightinginukraineby
      },
      {
        name: 'Putin and Zelenskyy shake hands by June 30?',
        coords: [48.3794, 31.1656],
        link: 'https://polymarket.com/event/putin-and-zelenskyy-shake-hands-by-june-30?via=polymap',
        icon: putinandzelenskyyshakehandsbyjune30
      }
    ];

    // 5. рисуем маркеры + раскладываем дубликаты по кругам
    const coordCounts = {};

    markers.forEach(m => {
      const key = m.coords.join(',');
      const index = coordCounts[key] || 0;  // какой по счёту маркер на этих координатах
      coordCounts[key] = index + 1;

      const opts = {
        icon: L.divIcon({
          className: m.icon.className, // применяем наш кастомный класс
          html: `<div class="custom-icon" style="background-image: url(${m.icon.iconUrl})"></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 20],
          popupAnchor: [0, -20]
        })
      };

      const marker = L.marker(m.coords, opts).addTo(map);

      marker.bindPopup(
        `<a href="${m.link}" target="_blank">${m.name}</a>`
      );

      setTimeout(() => {
        const el = marker.getElement();
        if (!el) return;

        el.classList.add('glow-icon');

        // если это не первый маркер на этих координатах — разносим по кругам
        if (index > 0) {
          const RING_SIZE = 12;      // сколько иконок максимум в одном "кольце"
          const RADIUS_STEP = 26;    // расстояние между кольцами (px)

          const ring = Math.floor((index - 1) / RING_SIZE) + 1;  // номер круга (1,2,3,...)
          const posInRing = (index - 1) % RING_SIZE;             // позиция внутри круга

          const angle = (360 / RING_SIZE) * posInRing;           // угол в градусах
          const radius = ring * RADIUS_STEP;                     // радиус этого круга

          // Применяем translate для сдвига иконок по кругу
          el.style.transform = `scale(1) translate(${Math.cos(angle * Math.PI / 180) * radius}px, ${Math.sin(angle * Math.PI / 180) * radius}px)`;
        }
      }, 0);
    });

    // Функция для масштабирования иконок
    function updateMarkerScale() {
      const z = map.getZoom();

      // базовая формула: чем больше зум, тем больше иконки
      let scale = 0.7 + (z - 2) * 0.15; // при z=2 ~0.7, при z=6 ~1.3

      // ограничим, чтобы не были слишком маленькими/огромными
      if (scale < 0.5) scale = 0.5;
      if (scale > 2)   scale = 2;

      // применяем масштаб ко всем иконкам
      document.querySelectorAll('.leaflet-marker-icon').forEach(el => {
        el.style.transform = `scale(${scale})`;
      });
    }

    // Обновляем при каждом изменении зума
    map.on('zoomend', updateMarkerScale);

    // И один раз при загрузке карты
    updateMarkerScale();

    console.log('markers added');
  </script>
</body>
</html>
