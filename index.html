<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polymarket Geopolitics Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100vh; width: 100%; }

  /* ✨ свечение иконок (без движения) */
  .glow-icon {
    transition: filter 0.25s ease;
    filter: drop-shadow(0 0 8px #2E5CFF);
    border-radius: 50%;        /* делаем иконки круглыми */
    overflow: hidden;          /* обрезаем углы */
  }

  .glow-icon:hover {
    filter: drop-shadow(0 0 8px #2E5CFF) drop-shadow(0 0 14px #2E5CFF);
  }
</style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    console.log('script start'); // проверка, что скрипт запустился

    // 1. создаём карту
    const map = L.map('map', {
      minZoom: 2,              // минимальный зум (самое дальнее отдаление)
      maxZoom: 19,             // как раньше
      maxBounds: [
        [-85, -180],           // юго-запад карты
        [85, 180]              // северо-восток карты
      ],
      maxBoundsViscosity: 1.0  // блокирует выход за край (важно!)
    }).setView([20, 0], 2);

    // 2. тёмный слой
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors, © CARTO'
    }).addTo(map);

    // 3. кастомные иконки
    const AhmedalSharaaoutasleaderofSyriabefore2027 = L.icon({
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Fahmed-al-sharaa-out-as-leader-of-syria-by-august-31-jw07b2UurIIh.jpg&w=96&q=100',
      iconSize: [5, 5],
      iconAnchor: [10, 20],
      popupAnchor: [0, -20]
    });
    const AhmedalSharaaoutasleaderofSyriain2025 = L.icon({
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Fahmed-al-sharaa-out-as-leader-of-syria-by-august-31-jw07b2UurIIh.jpg&w=96&q=100',
      iconSize: [5, 5],
      iconAnchor: [10, 20],
      popupAnchor: [0, -20]
    });
    const AbdulMalikoutasleaderofHouthisby = L.icon({
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Fabdul-malik-out-as-leader-of-houthis-by-september-30-Mo5xCY5XbsZe.png&w=96&q=100',
      iconSize: [5, 5],
      iconAnchor: [10, 20],
      popupAnchor: [0, -20]
    });

    // 4. маркеры
    const markers = [
      {
        name: 'Ahmed al-Sharaa out as leader of Syria before 2027?',
        coords: [34.8021, 38.9968],
        link: 'https://polymarket.com/event/ahmed-al-sharaa-out-as-leader-of-syria-before-2027',
        icon: AhmedalSharaaoutasleaderofSyriabefore2027
      },
      {
        name: 'Ahmed al-Sharaa out as leader of Syria in 2025?',
        coords: [34.8021, 38.9968],
        link: 'https://polymarket.com/event/ahmed-al-sharaa-out-as-leader-of-syria-in-2025',
        icon: AhmedalSharaaoutasleaderofSyriain2025
      },
      {
        name: 'Abdul-Malik out as leader of Houthis by...?',
        coords: [16.9400, 43.7630],
        link: 'https://polymarket.com/event/abdul-malik-out-as-leader-of-houthis-by-september-30',
        icon: AbdulMalikoutasleaderofHouthisby
      }
    ];

    // 5. рисуем маркеры + раздвигаем дубли по X
    const coordCounts = {};

    markers.forEach(m => {
      const key = m.coords.join(',');
      const index = coordCounts[key] || 0;   // какой по счёту маркер на этих координатах
      coordCounts[key] = index + 1;

      const opts = {};
      if (m.icon) opts.icon = m.icon;

      const marker = L.marker(m.coords, opts).addTo(map);

      marker.bindPopup(
        `<b>${m.name}</b><br><a href="${m.link}" target="_blank">Go to the Polymarket</a>`
      );

      // добавляем класс и сдвигаем дубликаты через margin-left
      setTimeout(() => {
        const el = marker.getElement();
        if (!el) return;

        el.classList.add('glow-icon');

        if (index > 0) {
          const offsetPx = 26 * index; // расстояние между иконками в пикселях
          el.style.marginLeft = offsetPx + 'px';
        }
      }, 0);
    });

    console.log('markers added');
  </script>
</body>
</html>
