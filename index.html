<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Моя карта мира</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. создаём карту и задаём стартовую позицию
    const map = L.map('map').setView([20, 0], 2); // центр мира

    // 2. добавляем слой OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 3. добавляем свои метки с ссылками
    const markers = [
      {
        name: 'Will Russia capture all of Pokrovsk by...?',
        coords: [48.282193, 37.1847804],
        link: 'https://polymarket.com/event/will-russia-capture-all-of-pokrovsk-by-september-30?tid=1763203001940'
      },
      {
        name: 'Kalshi',
        coords: [38.9072, -77.0369],
        link: 'https://kalshi.com'
      },
      {
        name: 'Infinex',
        coords: [37.7749, -122.4194],
        link: 'https://infinex.io'
      }
    ];

    markers.forEach(m => {
      const marker = L.marker(m.coords).addTo(map);
      marker.bindPopup(`<b>${m.name}</b><br><a href="${m.link}" target="_blank">Перейти на сайт</a>`);
    });
  </script>
</body>
</html>
