<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polymarket Geopolitical Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. создаём карту и задаём стартовую позицию
    const map = L.map('map').setView([20, 0], 2); // центр мира

    // 2. добавляем тёмный слой (2–3 цвета)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors, © CARTO'
    }).addTo(map);

    // 🔥 кастомная иконка для первого маркера
    const pokrovskIcon = L.icon({
      iconUrl: 'https://polymarket.com/_next/image?url=https%3A%2F%2Fpolymarket-upload.s3.us-east-2.amazonaws.com%2Fwill-russia-capture-pokrovsk-by-ppynW6JKABNP.jpg&w=256&q=100',
      iconSize: [20, 20],
      iconAnchor: [20, 40],
      popupAnchor: [0, -35]
    });

    // 3. список меток
    const markers = [
      {
        name: 'Will Russia capture all of Pokrovsk by...?',
        coords: [48.282193, 37.1847804],
        link: 'https://polymarket.com/event/will-russia-capture-all-of-pokrovsk-by-september-30?tid=1763203001940',
        icon: pokrovskIcon
      },
      {
        name: 'Kalshi',
        coords: [38.9072, -77.0369],
        link: 'https://kalshi.com',
        icon: null
      },
      {
        name: 'Infinex',
        coords: [37.7749, -122.4194],
        link: 'https://infinex.io',
        icon: null
      }
    ];

    // рендерим маркеры
    markers.forEach(m => {
      const marker = L.marker(m.coords, m.icon ? { icon: m.icon } : {}).addTo(map);
      marker.bindPopup(`<b>${m.name}</b><br><a href="${m.link}" target="_blank">Перейти на сайт</a>`);
    });
  </script>
</body>
</html>
